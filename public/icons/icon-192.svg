<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Background cream tile -->
  <rect width="192" height="192" fill="#EBE2D0"/>
  <!-- Subtle border -->
  <rect x="4" y="4" width="184" height="184" rx="24" fill="none" stroke="#DCC9A8" stroke-width="1"/>
  
  <!-- Laurel branches -->
  <g stroke="#B8934A" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Left branch -->
    <path d="M68 130 C72 118 78 108 88 100"/>
    <path d="M68 130 C70 122 71 116 73 110"/>
    <ellipse cx="74" cy="114" rx="4" ry="7" transform="rotate(-20 74 114)" stroke="#B8934A" stroke-width="1"/>
    <ellipse cx="78" cy="107" rx="3.5" ry="6" transform="rotate(-15 78 107)" stroke="#B8934A" stroke-width="1"/>
    <ellipse cx="83" cy="102" rx="3" ry="5" transform="rotate(-10 83 102)" stroke="#B8934A" stroke-width="1"/>
    
    <!-- Right branch -->
    <path d="M124 130 C120 118 114 108 104 100"/>
    <path d="M124 130 C122 122 121 116 119 110"/>
    <ellipse cx="118" cy="114" rx="4" ry="7" transform="rotate(20 118 114)" stroke="#B8934A" stroke-width="1"/>
    <ellipse cx="114" cy="107" rx="3.5" ry="6" transform="rotate(15 114 107)" stroke="#B8934A" stroke-width="1"/>
    <ellipse cx="109" cy="102" rx="3" ry="5" transform="rotate(10 109 102)" stroke="#B8934A" stroke-width="1"/>
  </g>
  
  <!-- Burgundy accent dot at branch junction -->
  <circle cx="96" cy="132" r="4" fill="#6B1F2A"/>
  
  <!-- Sun ring (RAdiaeta single thin ring) -->
  <circle cx="96" cy="82" r="22" fill="none" stroke="#B8934A" stroke-width="1.5"/>
  
  <!-- Sun disk -->
  <circle cx="96" cy="82" r="16" fill="#B8934A"/>
  
  <!-- Sun rays -->
  <g stroke="#B8934A" stroke-width="1.8" stroke-linecap="round">
    <line x1="96" y1="58" x2="96" y2="62"/>
    <line x1="96" y1="102" x2="96" y2="106"/>
    <line x1="72" y1="82" x2="68" y2="82"/>
    <line x1="120" y1="82" x2="124" y2="82"/>
    <line x1="79" y1="65" x2="76" y2="62"/>
    <line x1="113" y1="65" x2="116" y2="62"/>
    <line x1="79" y1="99" x2="76" y2="102"/>
    <line x1="113" y1="99" x2="116" y2="102"/>
  </g>
</svg>
